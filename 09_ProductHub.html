<style>
  /* Layout: internal workspace — top bar, left collection rail, product grid, modal detail sheet.
     Single light theme by choice (mirrors the real internal tool). */
  :root {
    --ground: #f6f8fa;
    --ink: #243447;
    --ink-strong: #16293c;
    --accent: #2c5786;
    --select: #d9e6f2;
    color-scheme: light;
  }
  html, body { background: var(--ground); color: var(--ink); }
  body { font-family: "Noto Sans Thai", system-ui, sans-serif; font-size: 16px; line-height: 1.6; -webkit-font-smoothing: antialiased; }
  ::selection { background: var(--select); color: var(--ink-strong); }
  button:not(:disabled), select { cursor: pointer; }
  button:focus-visible, input:focus-visible, select:focus-visible, textarea:focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; }
  .product-card { transition: border-color 160ms ease, box-shadow 160ms ease; }
  .product-card:hover { border-color: #b3cce6; box-shadow: 0 8px 24px rgb(22 41 60 / 6%); }
  .tnum { font-variant-numeric: tabular-nums; }
  .ico { width: 1em; height: 1em; stroke: currentColor; fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; flex-shrink: 0; }
  @keyframes toastIn { from { transform: translateY(8px); opacity: 0 } to { transform: none; opacity: 1 } }
  .toast { animation: toastIn 180ms ease-out; }
  @media (prefers-reduced-motion: reduce) { *, *::before, *::after { transition: none !important; animation: none !important; } }
</style>

const S = { screen: 'login', brand: null, system: 'all', cat: 'mattress', search: '', unit: 'm', detail: null, editing: false, slide: {}, lightbox: null, addOpen: false };

/* ---------------- Helpers ---------------- */
const esc = (s) => String(s ?? '').replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const brandOf = (name) => BRANDS.find((b) => b.name === name) || BRANDS[0];
const catStyle = (cat) => STYLES[cat.id === 'mattress' && S.brand ? brandOf(S.brand).color : cat.color];
const fmtMoney = (v) => (v == null ? '-' : v.toLocaleString('th-TH') + ' บาท');
const toDisp = (m) => (m == null ? '' : S.unit === 'cm' ? String(Math.round(m * 1000) / 10) : String(Math.round(m * 1000) / 1000));
const uLabel = () => (S.unit === 'cm' ? 'ซม.' : 'ม.');
const mismatch = (a, b) => a != null && b != null && Math.abs(a - b) > 0.001;
const countMis = (vs) => vs.reduce((n, v) => n + AXES.filter((a) => mismatch(v.system[a.key], v.measured[a.key])).length, 0);
const allItems = () => Object.values(DATA).flat();
const findItem = (id) => allItems().find((i) => i.id === id);

function currentItems() {
  let list = DATA[S.cat] || [];
  if (S.cat === 'mattress') {
    list = list.filter((i) => i.brand === S.brand);
    if (S.system !== 'all') list = list.filter((i) => i.supportSystem === S.system);
  }
  const q = S.search.trim().toLowerCase();
  if (q) list = list.filter((i) => i.name.toLowerCase().includes(q));
  return list;
}

function toast(kind, msg) {
  const root = document.getElementById('toast-root');
  const ok = kind === 'success';
  root.innerHTML = `<div class="toast pointer-events-auto flex items-center gap-2 rounded-xl px-4 py-3 text-sm shadow-lg ${ok ? 'bg-emerald-600 text-white' : 'bg-slate-800 text-white'}">${icon(ok ? 'checkc' : 'alert', 'w-4 h-4')}<span>${esc(msg)}</span></div>`;
  clearTimeout(toast.t);
  toast.t = setTimeout(() => (root.innerHTML = ''), 3200);
}

/* ---------------- Detail modal ---------------- */
function field(label, value) {
  return `<div><div class="text-xs font-medium text-slate-500 mb-0.5">${label}</div><div class="text-sm text-slate-700">${value ? esc(value) : '<span class="text-slate-300">- ยังไม่ระบุ -</span>'}</div></div>`;
}
function editField(label, key, value, options) {
  const id = 'f-' + key;
  if (options) return `<div><label for="${id}" class="block text-xs font-medium text-slate-500 mb-1">${label}</label><select id="${id}" data-field="${key}" class="w-full text-sm px-3 py-1.5 rounded-lg border border-slate-200 bg-white outline-none focus:ring-2 focus:ring-brand-100 focus:border-brand-400"><option value="">- ยังไม่ระบุ -</option>${options.map((o) => `<option ${o === value ? 'selected' : ''}>${esc(o)}</option>`).join('')}</select></div>`;
  return `<div><label for="${id}" class="block text-xs font-medium text-slate-500 mb-1">${label}</label><input id="${id}" data-field="${key}" value="${esc(value)}" class="w-full text-sm px-3 py-1.5 rounded-lg border border-slate-200 outline-none focus:ring-2 focus:ring-brand-100 focus:border-brand-400"></div>`;
}

function VariantRow(item, v, isMattress) {
  const cells = AXES.map((a) => {
    const sys = v.system[a.key], meas = v.measured[a.key], mis = mismatch(sys, meas);
    const box = `rounded-lg border px-2.5 py-2 min-w-0 ${mis ? 'bg-amber-50 border-amber-300' : 'bg-white border-slate-200'}`;
    const head = `<div class="flex items-center justify-between mb-1"><span class="text-xs font-medium text-slate-500">${a.label}</span>${mis ? `<span class="text-amber-500">${icon('alert', 'w-3 h-3')}</span>` : ''}</div>`;
    if (S.editing) return `<div class="${box}">${head}<div class="text-xs text-slate-400 mb-1 tnum">ระบบ: ${sys == null ? '-' : toDisp(sys) + ' ' + uLabel()}</div>
      <input type="number" step="0.01" inputmode="decimal" data-meas="${v.id}" data-axis="${a.key}" value="${toDisp(meas)}" placeholder="วัดจริง" aria-label="${a.label} วัดจริง ${esc(v.label)}" class="w-full text-sm px-1.5 py-1 rounded border outline-none tnum focus:ring-2 focus:ring-brand-100 focus:border-brand-400 ${mis ? 'border-amber-300 bg-amber-50/60 text-amber-800 font-medium' : 'border-slate-200 text-slate-800'}"></div>`;
    return `<div class="${box}">${head}<div class="text-sm tnum ${mis ? 'text-amber-700 font-medium' : 'text-slate-700'}">${meas == null ? '-' : toDisp(meas) + ' ' + uLabel()}</div>${sys != null ? `<div class="text-xs text-slate-400 tnum">ระบบ: ${toDisp(sys)} ${uLabel()}</div>` : ''}</div>`;
  }).join('');
  const right = S.editing
    ? `<label class="flex items-center gap-1.5 text-xs text-slate-500">จำนวนคงเหลือ <input type="number" data-qty="${v.id}" value="${v.quantity ?? ''}" placeholder="-" class="w-20 text-sm px-2 py-1 rounded-lg border border-slate-200 text-right tnum outline-none focus:ring-2 focus:ring-brand-100 focus:border-brand-400"> <span class="text-slate-400">${esc(item.unit)}</span></label>`
    : `<div class="flex items-center gap-3 text-xs text-slate-500 tnum">${isMattress ? `<span>น้ำหนัก: ${v.weight ?? '-'} กก.</span>` : ''}<span>คงเหลือ: ${v.quantity ?? '-'} ${esc(item.unit)}</span></div>`;
  return `<div class="rounded-xl bg-slate-50/70 border border-slate-100 p-3">
    <div class="flex flex-wrap items-center justify-between gap-2 mb-2.5"><span class="text-sm font-medium text-slate-700 flex items-center gap-1.5"><span class="text-slate-400">${icon('ruler', 'w-3.5 h-3.5')}</span>${esc(v.label)}</span>${right}</div>
    <div class="grid grid-cols-3 gap-2">${cells}</div></div>`;
}

function DetailModal() {
  const item = findItem(S.detail); if (!item) return '';
  const cat = CATEGORIES.find((c) => c.id === item.category); const st = catStyle(cat);
  const isM = item.category === 'mattress';
  const mis = countMis(item.variants);
  const imgs = item.images || [];
  const spec = Object.entries(item.springSpec || {});
  return `
  <div class="fixed inset-0 z-[150] bg-black/50 flex items-center justify-center p-4" data-act="close-bg">
    <div class="bg-white rounded-2xl shadow-2xl w-full max-w-5xl max-h-[90vh] overflow-y-auto" role="dialog" aria-modal="true" aria-labelledby="detail-title">
      <div class="sticky top-0 bg-white border-b border-slate-100 px-5 py-4 flex items-center justify-between gap-3 z-10">
        <div class="flex items-center gap-3 min-w-0">
          <div class="w-10 h-10 shrink-0 rounded-xl flex items-center justify-center ${st.iconBg}">${icon('pkg', 'w-5 h-5')}</div>
          <div class="min-w-0"><h2 id="detail-title" class="font-bold text-slate-800 truncate">${esc(item.name)}</h2><p class="text-xs text-slate-400">หน่วย: ${esc(item.unit)} · ${item.variants.length} รายการย่อย</p></div>
        </div>
        <div class="flex items-center gap-2 shrink-0">
          ${mis ? `<span class="hidden sm:flex items-center gap-1 text-xs font-medium bg-amber-100 text-amber-700 px-2 py-1 rounded-full">${icon('alert', 'w-3 h-3')} ขนาดไม่ตรง ${mis}</span>` : ''}
          <button type="button" data-act="edit" class="flex items-center gap-1.5 text-xs font-medium px-3 py-1.5 rounded-full text-white hover:opacity-90 ${S.editing ? 'bg-emerald-600' : st.solid}">${S.editing ? icon('check', 'w-3.5 h-3.5') + ' เสร็จสิ้น' : icon('pencil', 'w-3.5 h-3.5') + ' แก้ไข'}</button>
          <button type="button" data-act="close" aria-label="ปิด" class="p-1.5 rounded-lg text-slate-400 hover:text-slate-600 hover:bg-slate-100 text-xl">${icon('x')}</button>
        </div>
      </div>
      <div class="p-5"><div class="grid grid-cols-1 lg:grid-cols-2 gap-6">
        <div class="min-w-0 space-y-3">
          ${imgs[0] ? `<button type="button" data-act="lightbox" data-v="0" class="block w-full rounded-xl overflow-hidden border border-slate-200 bg-[#f3f5f7] aspect-[4/3] max-w-full"><img src="${imgs[S.lightbox ?? 0]?.url || imgs[0].url}" alt="${esc(item.name)}" class="w-full h-full object-cover"></button>` : ''}
          <div class="flex flex-wrap items-center justify-between gap-2">
            <div class="flex items-center gap-1.5 text-xs font-medium text-slate-500">${icon('image', 'w-3.5 h-3.5')} รูปภาพสินค้า (${imgs.length})</div>
            <div class="flex flex-wrap items-center gap-1.5">
              <button type="button" data-act="upload" class="flex items-center gap-1 text-xs px-2.5 py-1.5 rounded-lg bg-slate-100 hover:bg-slate-200 text-slate-700">${icon('upload', 'w-3.5 h-3.5')} อัปโหลด</button>
              <button type="button" data-act="demo-only" class="flex items-center gap-1 text-xs px-2.5 py-1.5 rounded-lg bg-slate-100 hover:bg-slate-200 text-slate-700">${icon('camera', 'w-3.5 h-3.5')} ถ่ายภาพ</button>
              <button type="button" data-act="demo-only" class="flex items-center gap-1 text-xs px-2.5 py-1.5 rounded-lg bg-slate-100 hover:bg-slate-200 text-slate-700">${icon('folder', 'w-3.5 h-3.5')} เลือกจาก Drive</button>
            </div>
          </div>
          <div id="dropzone" class="rounded-xl border-2 border-dashed border-slate-200 p-2.5">
            ${imgs.length ? `<div class="flex flex-wrap gap-2">${imgs.map((im, i) => `
              <div class="relative group w-20 h-20 rounded-lg overflow-hidden border ${i === (S.lightbox ?? 0) ? 'border-brand-500 ring-2 ring-brand-100' : 'border-slate-200'} bg-white">
                <button type="button" data-act="lightbox" data-v="${i}" class="w-full h-full" aria-label="ดูรูปที่ ${i + 1}"><img src="${im.url}" alt="" class="w-full h-full object-cover"></button>
                <button type="button" data-act="del-img" data-v="${i}" aria-label="ลบรูป" class="absolute top-1 right-1 w-6 h-6 rounded-full bg-black/60 hover:bg-red-600 text-white flex items-center justify-center opacity-0 group-hover:opacity-100 focus:opacity-100 transition">${icon('trash', 'w-3.5 h-3.5')}</button>
              </div>`).join('')}</div>` : '<p class="text-xs text-slate-400 text-center py-3">ลากรูปมาวางที่นี่ หรือกดอัปโหลด</p>'}
          </div>
        </div>
        <div class="space-y-4 min-w-0">
          ${item.costSecondHand != null || item.costNew != null ? `<div class="flex flex-wrap gap-2"><span class="text-xs bg-slate-100 text-slate-600 px-2.5 py-1 rounded-full tnum">ต้นทุนมือสอง: ${fmtMoney(item.costSecondHand)}</span><span class="text-xs bg-slate-100 text-slate-600 px-2.5 py-1 rounded-full tnum">ของใหม่ห้าง: ${fmtMoney(item.costNew)}</span></div>` : ''}
          ${isM ? `<div class="rounded-xl bg-brand-50/50 border border-brand-100 p-3 space-y-3">
            <p class="text-xs font-semibold text-brand-700 flex items-center gap-1.5">${icon('bed', 'w-3.5 h-3.5')} ข้อมูลสเปคที่นอน</p>
            <div class="grid grid-cols-1 sm:grid-cols-2 gap-2.5">
              ${S.editing ? [
                editField('แบรนด์', 'brand', item.brand, BRANDS.map((x) => x.name)),
                editField('ระบบรองรับ', 'supportSystem', item.supportSystem, SYSTEMS),
                editField('รุ่น', 'model', item.model), editField('ปีที่ผลิต', 'productionYear', item.productionYear),
                editField('ความนุ่ม', 'firmness', item.firmness, ['นุ่มพิเศษ', 'นุ่ม', 'ปานกลาง', 'แน่น', 'แน่นพิเศษ']),
                editField('หน้าผ้า / ลาย', 'fabricPattern', item.fabricPattern), editField('เกรดผ้า', 'fabricGrade', item.fabricGrade),
                editField('ชั้นขาย (หน้าผ้าที่ลูกค้าเห็น)', 'salesLayer', item.salesLayer), editField('ชั้น BOM (โครงสร้างวัสดุ)', 'bomLayer', item.bomLayer),
              ].join('') : [
                field('แบรนด์', item.brand), field('ระบบรองรับ', item.supportSystem), field('รุ่น', item.model), field('ปีที่ผลิต', item.productionYear),
                field('ความนุ่ม', item.firmness), field('หน้าผ้า / ลาย', item.fabricPattern), field('เกรดผ้า', item.fabricGrade),
                field('ชั้นขาย (หน้าผ้าที่ลูกค้าเห็น)', item.salesLayer), field('ชั้น BOM (โครงสร้างวัสดุ)', item.bomLayer),
              ].join('')}
            </div>
            <div><div class="text-xs font-medium text-slate-500 mb-1.5">ช่องทางจำหน่าย</div>
              <div class="flex flex-wrap gap-1.5">${S.editing
                ? CHANNELS.map((c) => { const on = item.channels.includes(c); return `<button type="button" data-act="channel" data-v="${esc(c)}" aria-pressed="${on}" class="text-xs px-2.5 py-1 rounded-full border transition ${on ? 'bg-brand-600 border-brand-600 text-white' : 'bg-white border-slate-200 text-slate-500 hover:border-brand-300'}">${esc(c)}</button>`; }).join('')
                : item.channels.length ? item.channels.map((c) => `<span class="text-xs px-2.5 py-1 rounded-full bg-brand-50 text-brand-700 border border-brand-100">${esc(c)}</span>`).join('') : '<span class="text-sm text-slate-300">- ยังไม่ระบุ -</span>'}</div></div>
          </div>` : ''}
          <div class="space-y-3">${item.variants.map((v) => VariantRow(item, v, isM)).join('')}</div>
          <div><div class="text-xs font-medium text-slate-500 mb-1">บันทึกเพิ่มเติม</div>
            ${S.editing ? `<textarea id="f-note" data-field="note" rows="2" aria-label="บันทึกเพิ่มเติม" placeholder="เพิ่มบันทึกเกี่ยวกับสินค้านี้..." class="w-full text-sm px-3 py-2 rounded-xl border border-slate-200 outline-none focus:ring-2 focus:ring-brand-100 focus:border-brand-400 resize-none">${esc(item.note)}</textarea>` : `<p class="text-sm text-slate-600">${item.note ? esc(item.note) : '<span class="text-slate-300">ไม่มีบันทึก</span>'}</p>`}</div>
          ${(item.bomComponents || []).length ? `<div><div class="text-xs font-medium text-slate-500 mb-1.5">รายการวัตถุดิบ (BOM)</div><div class="space-y-2">${item.bomComponents.map((c) => `
            <div class="rounded-lg border border-slate-100 bg-slate-50/70 px-3 py-2"><div class="flex items-center flex-wrap gap-1.5 mb-1"><span class="text-[11px] font-semibold px-1.5 py-0.5 rounded bg-slate-200 text-slate-700">ชั้น ${c.layer}</span><span class="text-[11px] text-slate-400 font-mono">${c.code}</span></div><p class="text-sm text-slate-700 leading-snug">${esc(c.description)}</p></div>`).join('')}</div></div>` : ''}
          ${isM && spec.length ? `<div><div class="text-xs font-medium text-slate-500 mb-1.5">สเปกโครงสปริง</div><div class="grid grid-cols-1 sm:grid-cols-2 gap-2 p-3 rounded-xl bg-slate-50 border border-slate-200">${spec.map(([k, v]) => `<div class="rounded-lg bg-white border border-slate-100 px-3 py-2"><div class="text-[11px] text-slate-400 leading-snug">${k}</div><div class="text-sm text-slate-800 font-semibold mt-0.5 tnum">${v}</div></div>`).join('')}</div></div>` : ''}
        </div>
      </div>
      ${S.editing ? `<button type="button" data-act="delete" data-v="${item.id}" class="w-full mt-4 flex items-center justify-center gap-1.5 text-sm px-4 py-2.5 rounded-xl bg-red-50 hover:bg-red-100 text-red-600 font-medium">${icon('trash', 'w-4 h-4')} ลบสินค้านี้ออกจากรายการ</button>` : ''}
      </div>
    </div>
  </div>`;
}

/* ---------------- Confirm (in-page; native confirm() is blocked) ---------------- */
let pendingDelete = null;
function ConfirmDialog() {
  const item = findItem(pendingDelete);
  return `<div class="fixed inset-0 z-[200] bg-black/50 flex items-center justify-center p-4"><div class="bg-white rounded-2xl shadow-2xl w-full max-w-sm p-6 space-y-4" role="alertdialog" aria-modal="true">
    <div class="w-11 h-11 rounded-xl bg-red-50 text-red-600 flex items-center justify-center">${icon('trash', 'w-5 h-5')}</div>
    <div><h3 class="font-bold text-slate-800">ลบ “${esc(item?.name)}” ?</h3><p class="text-sm text-slate-500 mt-1">สินค้าและรูปภาพทั้งหมดของรายการนี้จะถูกลบออกจากคลัง</p></div>
    <div class="flex gap-2 justify-end"><button type="button" data-act="cancel-del" class="text-sm px-4 py-2 rounded-full bg-slate-100 hover:bg-slate-200 text-slate-700">ยกเลิก</button><button type="button" data-act="confirm-del" class="text-sm px-4 py-2 rounded-full bg-red-600 hover:bg-red-700 text-white font-medium">ลบสินค้า</button></div>
  </div></div>`;
}

/* ---------------- Render ---------------- */
function render() {
  const app = document.getElementById('app');
  app.innerHTML = S.screen === 'login' ? LoginScreen() : S.screen === 'brand' ? BrandGate() : S.screen === 'system' ? SystemGate() : Dashboard();
  renderModal();
}
function renderModal() {
  const root = document.getElementById('modal-root');
  const scroller = root.querySelector('[role=dialog]');
  const top = scroller ? scroller.scrollTop : 0;
  root.innerHTML = (S.detail ? DetailModal() : '') + (pendingDelete ? ConfirmDialog() : '');
  const next = root.querySelector('[role=dialog]');
  if (next) next.scrollTop = top;
  document.body.style.overflow = S.detail ? 'hidden' : '';
}
function rerenderSearch() {
  // Keep focus in the search box while typing: re-render only the grid + counter.
  const tmp = document.createElement('div'); tmp.innerHTML = Dashboard();
  document.getElementById('grid').replaceWith(tmp.querySelector('#grid'));
  document.querySelector('[role=status]').textContent = tmp.querySelector('[role=status]').textContent;
}

/* ---------------- Events ---------------- */
document.addEventListener('click', (e) => {
  const el = e.target.closest('[data-act]'); if (!el) return;
  const act = el.dataset.act, v = el.dataset.v;
  if (act === 'close-bg' && e.target !== el) return;
  switch (act) {
    case 'toggle-pass': { const p = document.getElementById('login-pass'); p.type = p.type === 'password' ? 'text' : 'password'; return; }
    case 'pick-brand': S.brand = v; S.screen = 'system'; break;
    case 'pick-system': S.system = v; S.cat = 'mattress'; S.screen = 'dash'; S.search = ''; break;
    case 'to-brand': S.screen = 'brand'; S.detail = null; break;
    case 'logout': S.screen = 'login'; S.detail = null; S.brand = null; break;
    case 'cat': S.cat = v; S.system = 'all'; S.addOpen = false; break;
    case 'all-systems': S.system = 'all'; break;
    case 'unit': S.unit = v; break;
    case 'slide': { e.stopPropagation(); const it = findItem(v); const n = it.images.length; S.slide[v] = ((S.slide[v] || 0) + Number(el.dataset.d) + n) % n; break; }
    case 'open': S.detail = v; S.editing = false; S.lightbox = 0; return renderModal();
    case 'close': case 'close-bg': S.detail = null; S.editing = false; render(); return;
    case 'edit': S.editing = !S.editing; if (!S.editing) toast('success', 'บันทึกการแก้ไขแล้ว'); render(); return;
    case 'lightbox': S.lightbox = Number(v); return renderModal();
    case 'upload': document.getElementById('file-input').click(); return;
    case 'demo-only': toast('info', 'ฟีเจอร์นี้เชื่อมกับกล้อง/Google Drive ในระบบจริง ปิดไว้ในเดโม'); return;
    case 'del-img': { const it = findItem(S.detail); it.images.splice(Number(v), 1); S.lightbox = 0; toast('success', 'ลบรูปแล้ว'); render(); return; }
    case 'channel': { const it = findItem(S.detail); it.channels = it.channels.includes(v) ? it.channels.filter((c) => c !== v) : [...it.channels, v]; return renderModal(); }
    case 'delete': pendingDelete = v; return renderModal();
    case 'cancel-del': pendingDelete = null; return renderModal();
    case 'confirm-del': {
      const it = findItem(pendingDelete); DATA[it.category] = DATA[it.category].filter((i) => i.id !== it.id);
      toast('success', `ลบ “${it.name}” แล้ว`); pendingDelete = null; S.detail = null; S.editing = false; break;
    }
    case 'add-open': S.addOpen = true; render(); document.getElementById('add-name')?.focus(); return;
    case 'add-close': S.addOpen = false; break;
    case 'export': toast('success', 'สำรองข้อมูลสำเร็จ ไฟล์ Excel ถูกดาวน์โหลดแล้ว (จำลอง)'); return;
    case 'import': toast('info', 'ระบบจริงนำเข้าไฟล์ Excel/BOM ได้ ปิดไว้ในเดโม'); return;
    default: return;
  }
  render();
});

document.addEventListener('submit', (e) => {
  e.preventDefault();
  if (e.target.id === 'login-form') { S.screen = 'brand'; render(); return; }
  if (e.target.id === 'add-form') {
    const name = document.getElementById('add-name').value.trim(); if (!name) return;
    const unit = document.getElementById('add-unit').value.trim() || 'ชิ้น';
    const id = 'new-' + Date.now();
    const base = { id, category: S.cat, name, unit, costSecondHand: null, costNew: null, note: '', images: [], variants: [{ id: id + '-std', label: 'มาตรฐาน', system: dims(), measured: dims(), quantity: null }] };
    if (S.cat === 'mattress') Object.assign(base, { brand: S.brand, supportSystem: S.system !== 'all' ? S.system : '', channels: [], bomComponents: [], springSpec: {} });
    DATA[S.cat].push(base); S.addOpen = false;
    toast('success', `เพิ่ม “${name}” แล้ว`); render();
  }
});

document.addEventListener('input', (e) => {
  if (e.target.id === 'search') { S.search = e.target.value; rerenderSearch(); }
});

document.addEventListener('change', (e) => {
  const t = e.target;
  if (t.id === 'system-filter') { S.system = t.value; render(); return; }
  if (t.id === 'file-input') {
    const it = findItem(S.detail); if (!it) return;
    [...t.files].forEach((f) => { const r = new FileReader(); r.onload = () => { it.images.push(img(r.result, f.name)); renderModal(); }; r.readAsDataURL(f); });
    toast('success', `เพิ่มรูป ${t.files.length} รูปแล้ว`); t.value = ''; return;
  }
  const it = findItem(S.detail); if (!it) return;
  if (t.dataset.meas) {
    const v = it.variants.find((x) => x.id === t.dataset.meas);
    const n = parseFloat(t.value);
    v.measured[t.dataset.axis] = Number.isFinite(n) ? (S.unit === 'cm' ? n / 100 : n) : null;
    render();
  } else if (t.dataset.qty) {
    const v = it.variants.find((x) => x.id === t.dataset.qty); const n = parseInt(t.value, 10);
    v.quantity = Number.isFinite(n) ? n : null;
  } else if (t.dataset.field) {
    it[t.dataset.field] = t.value;
    if (t.dataset.field === 'brand' || t.dataset.field === 'supportSystem') render();
  }
});

document.addEventListener('keydown', (e) => {
  if (e.key === 'Escape') {
    if (pendingDelete) { pendingDelete = null; renderModal(); }
    else if (S.detail) { S.detail = null; S.editing = false; render(); }
  }
  if ((e.key === 'Enter' || e.key === ' ') && e.target.matches('span[role=button]')) { e.preventDefault(); e.target.click(); }
});

/* Drag & drop images onto the gallery */
document.addEventListener('dragover', (e) => { if (e.target.closest('#dropzone')) e.preventDefault(); });
document.addEventListener('drop', (e) => {
  if (!e.target.closest('#dropzone')) return; e.preventDefault();
  const it = findItem(S.detail);
  [...e.dataTransfer.files].filter((f) => f.type.startsWith('image/')).forEach((f) => { const r = new FileReader(); r.onload = () => { it.images.push(img(r.result, f.name)); renderModal(); }; r.readAsDataURL(f); });
});

render();
</script>

</body></html>
