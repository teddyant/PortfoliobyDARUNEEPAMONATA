<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#faf9f5;color:#141413}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Marketing Hub</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:wght@600;700&family=Inter:wght@400;500;600;700&family=IBM+Plex+Sans+Thai:wght@400;500;600;700&display=swap">
<style>
/* Layout: navy app sidebar + warm working canvas; single light look by design (the product's own UI) */
:root{
  color-scheme:light;
  --navy:#1B2A4A;--navy2:#243660;--gold:#B8924B;--goldM:#D4AF6A;--goldL:#FBF5E9;
  --bg:#F7F4EE;--card:#FFFEFA;--bdr:#E7E1D3;--line:#F0EBE0;--track:#EFEAE0;
  --t1:#211C16;--t2:#5B554B;--t3:#9C9284;--sbt:#C7D0E6;--sbm:#6F7BA0;--onNavy:#FFFFFF;--onNavyMuted:#AEB8D4;
  --s1:#2a78d6;--s2:#1baf7a;--s3:#eda100;--s5:#4a3aa7;--s6:#e34948;--s8:#eb6834;
  --good:#0ca30c;--warnT:#8A6200;--critical:#d03b3b;
  --okBg:#E6F6EA;--okT:#137A2C;--wnBg:#FFF4DA;--bdBg:#FDE8E8;--bdT:#A12A2A;--blBg:#E7EFFB;--blT:#1F5CAA;--tBg:#E3F6EE;--sBg:#FDF2DC;
  --fh:'Fraunces','IBM Plex Sans Thai',Georgia,serif;
  --fb:'Inter','IBM Plex Sans Thai',system-ui,sans-serif;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;font-family:var(--fb);background:var(--bg);color:var(--t1);font-size:13px;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,.ni:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
svg.i{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex-shrink:0}

.note{background:var(--navy);color:var(--onNavyMuted);font-size:11.5px;text-align:center;padding:6px 16px;border-bottom:1px solid rgba(255,255,255,.08)}
.note b{color:var(--goldM);font-weight:600}
.shell{display:flex;min-height:calc(100% - 29px)}

.sb{width:236px;flex-shrink:0;background:var(--navy);color:var(--sbt);display:flex;flex-direction:column;padding-bottom:14px;position:sticky;top:0;height:calc(100vh - 29px);overflow-y:auto}
.brand{display:flex;gap:10px;align-items:center;padding:20px 18px 16px;border-bottom:1px solid rgba(255,255,255,.08)}
.logo{width:34px;height:34px;border-radius:9px;background:linear-gradient(135deg,var(--gold),var(--goldM));display:grid;place-items:center;color:var(--navy);font-family:'Fraunces',serif;font-weight:700;font-size:17px;flex-shrink:0}
.bn{font-family:'Fraunces',serif;font-weight:700;color:var(--onNavy);font-size:15.5px}
.bt{font-size:9.5px;letter-spacing:1.4px;text-transform:uppercase;color:var(--gold);margin-top:2px}
.lbl{font-size:9.5px;letter-spacing:1.3px;text-transform:uppercase;color:var(--sbm);padding:14px 20px 5px}
.meet{margin:12px 10px 2px;border:1px solid rgba(212,175,106,.28);border-radius:12px;padding:6px 0;background:rgba(255,255,255,.03)}
.meet .lbl{padding:6px 12px 4px}.meet .ni{padding:7px 10px;border-radius:0}
.nav{display:flex;flex-direction:column}
.ni{display:flex;align-items:center;gap:10px;padding:7px 18px;font-size:12px;line-height:1.35;color:var(--sbt);border:0;border-left:3px solid transparent;background:none;text-align:left;width:100%}
.ni:hover{background:rgba(255,255,255,.04);color:var(--onNavy)}
.ni.on{background:rgba(184,146,75,.14);color:var(--onNavy);border-left-color:var(--gold);font-weight:600}
.ni .bd{margin-left:auto;background:var(--gold);color:var(--navy);font-size:10px;font-weight:700;border-radius:10px;padding:1px 7px}
.me{margin-top:auto;display:flex;gap:10px;align-items:center;padding:14px 18px 0;border-top:1px solid rgba(255,255,255,.08)}
.av{width:30px;height:30px;border-radius:50%;background:#34466F;display:grid;place-items:center;color:var(--onNavy);font-size:11px;font-weight:600}

.main{flex:1;min-width:0;padding:26px 30px 36px;display:flex;flex-direction:column;gap:16px}
.hd{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;flex-wrap:wrap}
h1{font-family:var(--fh);font-size:28px;color:var(--navy);font-weight:700;margin:0;text-wrap:balance}
.sub{color:var(--t3);font-size:12.5px;margin-top:4px;max-width:70ch}
.btns{display:flex;gap:8px;flex-wrap:wrap}
.btn{display:inline-flex;align-items:center;gap:6px;padding:8px 14px;border-radius:9px;border:1px solid var(--bdr);background:var(--card);font-size:12px;font-weight:500;color:var(--t2)}
.btn.p{background:var(--navy);color:var(--onNavy);border-color:var(--navy)}
.flt{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.sel{padding:7px 12px;border:1px solid var(--bdr);border-radius:9px;background:var(--card);font-size:12px;font-weight:600;display:flex;gap:14px}
.sel::after{content:'▾';color:var(--t3)}
.pill{padding:6px 13px;border-radius:20px;border:1px solid var(--bdr);font-size:11.5px;color:var(--t2);background:var(--card)}
.pill.on{background:var(--navy);color:var(--onNavy);border-color:var(--navy)}
.sp{flex:1}
.card{background:var(--card);border:1px solid var(--bdr);border-radius:14px;padding:16px 18px;min-width:0}
.ct{font-weight:700;font-size:13.5px;display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:12px;flex-wrap:wrap}
.ct small{font-weight:500;color:var(--t3);font-size:11px}
.band{background:linear-gradient(120deg,var(--navy),var(--navy2));border-radius:14px;padding:18px 8px;display:grid;grid-template-columns:repeat(5,1fr);color:var(--onNavy);row-gap:16px}
.band>div{padding:0 18px;border-left:1px solid rgba(255,255,255,.12)}
.band>div:first-child{border:0}
.kv{font-family:'Fraunces',serif;font-size:25px;font-weight:700;font-variant-numeric:tabular-nums}
.kl{font-size:11px;color:var(--onNavyMuted);margin-top:3px}
.dl{font-size:10.5px;margin-top:6px;color:#7FE0A9}
.g{display:grid;gap:16px}
.g2{grid-template-columns:minmax(0,1.65fr) minmax(0,1fr)}
.g5{grid-template-columns:repeat(5,minmax(0,1fr))}
.lg{display:flex;gap:14px;font-size:11px;color:var(--t2);flex-wrap:wrap}
.lg i{display:inline-block;width:9px;height:9px;border-radius:2px;margin-right:5px;vertical-align:-1px}
.tw{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:12px}
th{text-align:left;font-size:10.5px;color:var(--t3);font-weight:600;text-transform:uppercase;letter-spacing:.6px;padding:0 8px 8px;border-bottom:1px solid var(--bdr);white-space:nowrap}
td{padding:9px 8px;border-bottom:1px solid var(--line);white-space:nowrap}
tr:last-child td{border:0}
.num{text-align:right;font-variant-numeric:tabular-nums}
.tag{font-size:10.5px;padding:2px 8px;border-radius:10px;font-weight:600;white-space:nowrap}
.ok{background:var(--okBg);color:var(--okT)}.wn{background:var(--wnBg);color:var(--warnT)}.bd2{background:var(--bdBg);color:var(--bdT)}.bl{background:var(--blBg);color:var(--blT)}
.bar{height:6px;background:var(--track);border-radius:4px;overflow:hidden}
.bar b{display:block;height:100%;border-radius:4px}
.ch{display:inline-flex;align-items:center;gap:6px}
.dot{width:8px;height:8px;border-radius:50%;flex-shrink:0}
.row{display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid var(--line)}
.row:last-child{border:0}
.ic{width:30px;height:30px;border-radius:8px;display:grid;place-items:center;flex-shrink:0}
.sm{font-size:11px;color:var(--t3)}
.ell{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.kc{background:var(--card);border:1px solid var(--bdr);border-radius:14px;padding:14px 16px;border-top:3px solid;min-width:0}
.kc .kv{font-size:23px;color:var(--navy)}
.chart svg{width:100%;height:auto;display:block}
.donut{display:flex;align-items:center;gap:18px;flex-wrap:wrap}
.donut svg{width:170px;height:170px;flex-shrink:0}

.calw{display:grid;grid-template-columns:minmax(0,1fr) 290px;gap:16px}
.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px;min-width:0}
.dh{font-size:10.5px;color:var(--t3);font-weight:600;text-align:center}
.dc{background:var(--card);border:1px solid var(--bdr);border-radius:9px;min-height:104px;padding:6px;display:flex;flex-direction:column;gap:3px;min-width:0}
.dc.x{opacity:.4}
.dc.td{border-color:var(--gold);box-shadow:0 0 0 2px rgba(184,146,75,.2)}
.dn2{font-size:11px;font-weight:600;color:var(--t2)}
.ev{font-size:10px;padding:3px 6px;border-radius:5px;line-height:1.3;border-left:3px solid;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.k{background:var(--blBg);border-color:var(--s1)}.t{background:var(--tBg);border-color:var(--s2)}.s{background:var(--sBg);border-color:var(--s3)}
.side{display:flex;flex-direction:column;gap:16px;min-width:0}

.kb{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px}
.col{background:#F1EDE4;border-radius:14px;padding:12px;display:flex;flex-direction:column;gap:10px;min-width:0}
.colh{display:flex;justify-content:space-between;align-items:center;font-weight:700;font-size:12.5px;padding:2px 4px}
.cnt{background:var(--card);border:1px solid var(--bdr);border-radius:10px;font-size:10.5px;padding:1px 8px;color:var(--t2)}
.task{background:var(--card);border:1px solid var(--bdr);border-radius:11px;padding:12px;display:flex;flex-direction:column;gap:8px}
.task h4{margin:0;font-size:12.5px;line-height:1.45;font-weight:600}
.meta{display:flex;justify-content:space-between;align-items:center;gap:8px;font-size:10.5px;color:var(--t3)}
.ava{width:22px;height:22px;border-radius:50%;display:grid;place-items:center;font-size:9.5px;font-weight:700;color:var(--onNavy)}
.okr{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}

.score{display:flex;gap:3px}
.score i{width:14px;height:6px;border-radius:2px;background:var(--track)}
.score i.f{background:var(--s1)}
.swot{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px}
.swot .card{border-top:3px solid}
.swot ul{margin:0;padding-left:18px;display:flex;flex-direction:column;gap:6px;line-height:1.5;color:var(--t2)}

@media (max-width:1180px){
  .band{grid-template-columns:repeat(3,1fr)}
  .band>div:nth-child(4){border:0}
  .g5{grid-template-columns:repeat(3,minmax(0,1fr))}
  .g2,.calw{grid-template-columns:minmax(0,1fr)}
  .side{flex-direction:row;flex-wrap:wrap}.side>.card{flex:1 1 260px}
  .kb,.swot{grid-template-columns:repeat(2,minmax(0,1fr))}
}
@media (max-width:820px){
  .shell{flex-direction:column}
  .sb{width:auto;height:auto;position:sticky;top:env(safe-area-inset-top,0px);z-index:5;padding-bottom:0}
  .brand{padding:12px 16px}
  .lbl,.me{display:none}
  .meet{display:contents}
  .nav{flex-direction:row;overflow-x:auto;padding:0 8px;scrollbar-width:none}
  .ni{width:auto;white-space:nowrap;border-left:0;border-bottom:3px solid transparent;padding:10px 12px}
  .ni.on{border-bottom-color:var(--gold)}
  .main{padding:20px 16px 32px}
  h1{font-size:23px}
  .band{grid-template-columns:repeat(2,1fr)}
  .band>div{border:0}
  .g5{grid-template-columns:repeat(2,minmax(0,1fr))}
  .main .g[style*="grid-template-columns"]{grid-template-columns:repeat(2,minmax(0,1fr))!important}
  .main .g.g2[style]{grid-template-columns:minmax(0,1fr)!important}
  .kb,.swot,.okr{grid-template-columns:minmax(0,1fr)}
  .cal{gap:3px}.dc{min-height:64px;padding:4px}.ev{font-size:0;height:6px;padding:0}
  .dh{font-size:9.5px}
}
@media (max-width:560px){
  .main .g[style*="grid-template-columns"]:not(.kpis){grid-template-columns:minmax(0,1fr)!important}
}
@media (prefers-reduced-motion:no-preference){
  .view{animation:in .25s ease-out}
  @keyframes in{from{opacity:.4;transform:translateY(4px)}to{opacity:1;transform:none}}
}
</style>

function lineChart(series,labels){
  const w=700,h=210,pad={l:40,r:12,t:10,b:24},max=400e3;
  const x=i=>pad.l+i*(w-pad.l-pad.r)/(labels.length-1),y=v=>h-pad.b-v/max*(h-pad.t-pad.b);
  let g='';
  for(let k=0;k<=4;k++){const v=max*k/4;g+=`<line x1="${pad.l}" x2="${w-pad.r}" y1="${y(v)}" y2="${y(v)}" stroke="var(--line)"/><text x="${pad.l-8}" y="${y(v)+3}" font-size="9.5" fill="var(--t3)" text-anchor="end">${v/1000}K</text>`}
  labels.forEach((l,i)=>g+=`<text x="${x(i)}" y="${h-6}" font-size="10" fill="var(--t3)" text-anchor="middle">${l}</text>`);
  series.forEach(s=>{
    const pts=s.d.map((v,i)=>`${x(i)},${y(v)}`).join(' ');
    if(s.fill)g+=`<polygon points="${pad.l},${y(0)} ${pts} ${x(s.d.length-1)},${y(0)}" fill="${s.c}" opacity=".08"/>`;
    g+=`<polyline points="${pts}" fill="none" stroke="${s.c}" stroke-width="2.2" stroke-linejoin="round"/>`;
    const li=s.d.length-1;g+=`<circle cx="${x(li)}" cy="${y(s.d[li])}" r="3.5" fill="${s.c}" stroke="var(--card)" stroke-width="1.5"/>`;
  });
  return `<div class="chart"><svg viewBox="0 0 ${w} ${h}" role="img" aria-label="กราฟงบโฆษณาเทียบรายได้รายเดือน">${g}</svg></div>`;
}
function donut(parts,center,sub){
  const size=170,r=size/2-12,C=2*Math.PI*r,tot=parts.reduce((a,p)=>a+p.v,0);let off=0,g='';

  return `<svg viewBox="0 0 ${size} ${size}">${g}<text x="50%" y="48%" text-anchor="middle" font-family="Fraunces,serif" font-weight="700" font-size="20" fill="var(--navy)">${center}</text><text x="50%" y="62%" text-anchor="middle" font-size="10" fill="var(--t3)">${sub}</text></svg>`;

const main=document.getElementById('main');
function show(p){
  if(!screens[p])p='dashboard';
  main.innerHTML=screens[p]();
  main.classList.remove('view');void main.offsetWidth;main.classList.add('view');
  document.querySelectorAll('.ni').forEach(n=>{const on=n.dataset.p===p;n.classList.toggle('on',on);on?n.setAttribute('aria-current','page'):n.removeAttribute('aria-current')});
  try{history.replaceState(null,'','#'+p)}catch(e){}
}
document.getElementById('nav').addEventListener('click',e=>{const b=e.target.closest('.ni');if(!b)return;show(b.dataset.p);window.scrollTo({top:0});b.scrollIntoView({block:'nearest',inline:'nearest'})});
show(location.hash.slice(1));
</script>
